name: Rust

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.94.0

jobs:
  build:
    name: Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            shell: bash
          - os: macos-14
            target: aarch64-apple-darwin
            shell: bash
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust at the declared minimum version
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install native build dependencies (Windows GNU)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build optimized libraries and examples
        run: cargo build --locked --release --workspace --all-features --examples --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features --target ${{ matrix.target }}

      - name: Run documentation tests
        run: cargo test --locked --workspace --doc --all-features --target ${{ matrix.target }}

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps --target ${{ matrix.target }}

      - name: Verify publishable packages
        if: runner.os == 'Linux'
        run: cargo package --locked --workspace --exclude astro-bench
