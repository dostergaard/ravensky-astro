name: Rust

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.94.0

jobs:
  build:
    name: Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            shell: bash
            packages: --workspace
          - os: macos-14
            target: aarch64-apple-darwin
            shell: bash
            packages: --workspace
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            shell: 'msys2 {0}'
            # sep-sys 1.3.0 requires POSIX rand_r and does not build on Windows.
            # Test the validator and consumers without the separate metrics crate.
            packages: -p astro-io -p astro-metadata -p astro-bench
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust at the declared minimum version
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Hosted runners already provide these tools. Avoid refreshing unrelated
          # apt repositories unless this build actually needs an installation.
          if [[ "$(dpkg-query -W -f='${Status}' build-essential 2>/dev/null || true)" != 'install ok installed' ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi

      - name: Install native build dependencies (Windows GNU)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked ${{ matrix.packages }} --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

      - name: Build optimized libraries and examples
        run: cargo build --locked --release ${{ matrix.packages }} --all-features --examples --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked ${{ matrix.packages }} --all-targets --all-features --target ${{ matrix.target }}

      - name: Run documentation tests
        run: cargo test --locked ${{ matrix.packages }} --doc --all-features --target ${{ matrix.target }}

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked ${{ matrix.packages }} --all-features --no-deps --target ${{ matrix.target }}

      - name: Verify publishable packages
        if: runner.os == 'Linux'
        run: cargo package --locked --workspace --exclude astro-bench
